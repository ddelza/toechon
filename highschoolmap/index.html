<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>광주·하남·양평 고등학교 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Pretendard", "Malgun Gothic", sans-serif; }
  #app { display: flex; height: 100%; }
  #side { width: 300px; display: flex; flex-direction: column; border-right: 1px solid #ddd; background: #fafafa; }
  #side header { padding: 14px 16px 10px; border-bottom: 1px solid #e5e5e5; }
  #side h1 { font-size: 17px; margin: 0 0 4px; }
  #side .sub { font-size: 12px; color: #666; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid #e5e5e5; }
  .chip { border: 1px solid #ccc; border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; background: #fff; user-select: none; }
  .chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .chip.off { opacity: .4; }
  #search { margin: 10px 16px; padding: 7px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  #list { flex: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
  #list li { padding: 9px 16px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; }
  #list li:hover { background: #eef4ff; }
  .km { color: #c92a2a; font-weight: 700; margin-left: 3px; }
  .lkm { float: right; color: #c92a2a; font-weight: 700; font-size: 13px; }
  .home-icon { color: #f59f00; font-size: 26px; line-height: 26px; text-align: center; text-shadow: 0 0 3px #000, 0 0 2px #000; }
  .home-label { background: #222; color: #fff; border: none; font-weight: 700; font-size: 13px; }
  .home-label::before { display: none; }
  .dong-path { transform-box: fill-box; transform-origin: center; transition: transform .18s ease, filter .18s ease, fill-opacity .18s ease; cursor: pointer; }
  .dong-path.lift { transform: scale(1.035); filter: drop-shadow(0 4px 6px rgba(25, 113, 194, .55)); }
  .dong-pop { font-size: 13px; line-height: 1.5; min-width: 170px; }
  .dong-pop > b { font-size: 15px; }
  .dp-row { margin-top: 3px; }
  .dp-row b { color: #1971c2; }
  .dp-sub { color: #666; font-size: 12px; }
  .dp-src { color: #999; font-size: 11px; margin-top: 5px; }
  .ldot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  #list li small { display: block; color: #777; font-size: 12px; margin-top: 2px; }
  #side footer { padding: 8px 16px; font-size: 11px; color: #888; border-top: 1px solid #e5e5e5; }
  #side footer button { font-size: 11px; }
  #map { flex: 1; }
  .hs-label { background: rgba(255,255,255,.92); border: 1px solid #888; border-radius: 4px; padding: 1px 5px;
              font-size: 12px; font-weight: 600; box-shadow: none; white-space: nowrap; }
  .hs-label::before { display: none; }
  .region-label { background: none; border: none; box-shadow: none; font-size: 20px; font-weight: 800;
                  color: rgba(0,0,0,.45); text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
  .region-label::before { display: none; }
  @media (max-width: 700px) {
    #app { flex-direction: column-reverse; }
    #side { width: 100%; height: 40%; border-right: none; border-top: 1px solid #ddd; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>광주·하남·양평 고등학교</h1>
      <div class="sub">★ 광수중학교에서 직선거리 · 가까운 순<br>읍·면·동을 누르면 인구와 고등학교 수가 나와요</div>
      <div class="sub" id="count">불러오는 중…</div>
    </header>
    <div class="filters" id="filters"></div>
    <input id="search" placeholder="학교 이름 검색">
    <ul id="list"></ul>
    <footer>
      자료: 경기도_고등학교 현황(경기데이터드림 Open API) · 경계: 통계청 시군구(2013)·행정동(2026.10) · 인구: 행정안전부 주민등록(2026.10)<br>
      <button id="fitAll">세 지역 전체 보기</button>
      <label><input type="checkbox" id="showLabels" checked> 이름 항상 표시</label>
    </footer>
  </aside>
  <div id="map"></div>
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js?v=20261126b"></script>
<script src="app.js?v=20261126b"></script>
</body>
</html>
